# Render free planı 15 dk istek gelmezse uyur; bu görev 10 dakikada bir /saglik adresine istek atar.
# /saglik veritabanına dokunmaz, böylece Neon gereksiz yere uyanık kalmaz.
name: Uyanık tut

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 "${APP_URL:-https://seans-muhasebe.onrender.com}/saglik"
        env:
          APP_URL: ${{ vars.APP_URL }}
