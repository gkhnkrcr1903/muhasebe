services:
  - type: web
    name: seans-muhasebe
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_URL     # Neon (ücretsiz PostgreSQL) bağlantı adresi
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFNE_PASSWORD
        sync: false
      - key: ELDA_PASSWORD
        sync: false
