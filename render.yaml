services:
  - type: web
    name: seans-muhasebe
    runtime: node
    plan: starter          # Kalıcı disk için ücretli plan gerekir (free planda disk yok)
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_PATH
        value: /var/data/muhasebe.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFNE_PASSWORD
        sync: false
      - key: ELDA_PASSWORD
        sync: false
    disk:
      name: muhasebe-data
      mountPath: /var/data
      sizeGB: 1
